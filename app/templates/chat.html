<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat de Soporte IA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .chat-container { background: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #chat-box { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; border-radius: 5px; margin-bottom: 15px; background-color: #f9f9f9;}
        .user-msg { text-align: right; margin: 10px 0; }
        .user-msg span { background-color: #007bff; color: white; padding: 8px 12px; border-radius: 15px; display: inline-block; max-width: 80%; }
        .bot-msg { text-align: left; margin: 10px 0; }
        .bot-msg span { background-color: #e9ecef; color: black; padding: 8px 12px; border-radius: 15px; display: inline-block; max-width: 80%; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h3 class="mb-3">🤖 Asistente de Soporte IA</h3>
        <div id="chat-box">
            <div class="bot-msg"><span>Hola, soy tu asistente técnico. ¿En qué te puedo ayudar hoy?</span></div>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" class="form-control" placeholder="Escribe tu problema técnico aquí...">
            <button class="btn btn-primary" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        async function enviarMensaje() {
            const input = document.getElementById("user-input");
            const mensaje = input.value.trim();
            if (!mensaje) return;

            const chatBox = document.getElementById("chat-box");
            
            // Agregar mensaje del usuario
            chatBox.innerHTML += `<div class="user-msg"><span>${mensaje}</span></div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Agregar mensaje de "escribiendo..."
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="bot-msg" id="${loadingId}"><span>Escribiendo...</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/chat/preguntar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pregunta: mensaje })
                });
                const data = await response.json();
                
                // Quitar el "escribiendo..." y poner la respuesta
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bot-msg"><span>${data.respuesta}</span></div>`;
                chatBox.scrollTop = chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bot-msg"><span>Error de conexión.</span></div>`;
            }
        }

        // Enviar con Enter
        document.getElementById("user-input").addEventListener("keypress", function (e) {
            if (e.key === "Enter") enviarMensaje();
        });
    </script>
</body>
</html>
